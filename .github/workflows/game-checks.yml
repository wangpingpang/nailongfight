name: Game checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  desktop-game:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test && npm run build
      - name: Install browser test client
        run: python3 -m pip install playwright==1.55.0
      - name: Walk the game in Chrome
        run: python3 scripts/browser-smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-game-check
          path: |
            production/qa/evidence/
            dist/echo-arena.html
